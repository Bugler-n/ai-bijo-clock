<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなで推し活 - AI美女時計</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300&text=AI%E7%BE%8E%E5%A5%B3%E6%99%82%E8%A8%88%E3%81%BF%E3%82%93%E3%81%AA%E3%81%A7%E6%8E%A8%E3%81%97%E6%B4%BB%E3%80%8C%E3%80%8D0123456789&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e0c12; --fg: #f1eef3; --accent: #ff8fb8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 22px 24px 4px; flex-wrap: wrap; }
  h1 { margin: 0; font-family: "Zen Kaku Gothic New", inherit; font-size: 22px; font-weight: 300; letter-spacing: .3em; }
  h1::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
               background: var(--accent); margin-right: .9em; vertical-align: .12em; box-shadow: 0 0 10px var(--accent); }
  .lead { padding: 4px 24px 0; margin: 0; color: #f1eef3a0; font-size: 13px; line-height: 1.8; }
  #grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 24px 150px; }   /* 下の固定表示ぶん空ける */
  .tile { position: relative; width: 84px; padding: 0; border: 1px solid #ffffff1f; border-radius: 8px; overflow: hidden;
          background: #1a1720; color: inherit; cursor: pointer; font: inherit; text-align: center; transition: transform .2s, border-color .2s; }
  .tile:hover { transform: translateY(-2px); border-color: #ffffff55; }
  .tile img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
  .tile span { display: block; padding: 4px 0 5px; font-size: 11px; color: #f1eef3b0; }
  /* 上位入りした子: 先頭に残し、ピンクの印を付ける */
  .tile.in { border-color: #ff8fb840; }
  .tile em { position: absolute; left: 0; right: 0; top: 0; padding: 3px 0; font-style: normal; font-weight: 700; font-size: 10px; letter-spacing: .06em;
             background: #0009; color: #fff; backdrop-filter: blur(3px); }
  .tile.done { opacity: .5; cursor: default; }
  .tile.done:hover { transform: none; border-color: #ffffff1f; }
  .tile.done span::before { content: "♥ "; color: var(--accent); }
  .empty { padding: 40px 24px; color: #f1eef380; }
  /* 画面下の中央に固定: 「時計に戻る」は常時、上位入りのお知らせはその上に出したままにする */
  #back { position: fixed; z-index: 5; left: 50%; bottom: 20px; transform: translateX(-50%); white-space: nowrap;
          background: #000c; border: 1px solid #ffffff44; border-radius: 22px; padding: 11px 26px; color: var(--fg);
          font-size: 14px; letter-spacing: .12em; text-decoration: none; backdrop-filter: blur(6px); }
  #back:hover { background: #000; border-color: #ffffff99; }
  #toast { position: fixed; z-index: 5; left: 50%; bottom: 76px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
           background: #000d; border: 1px solid #ffffff33; border-radius: 22px; padding: 10px 20px; font-size: 13px;
           transition: opacity .3s, transform .3s; max-width: calc(100vw - 32px); text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 520px) { header { padding: 16px 14px 4px; } h1 { font-size: 17px; } .lead { padding: 4px 14px 0; }
                              #grid { padding: 14px 14px 30px; gap: 6px; } .tile { width: calc((100% - 24px) / 5); } }
</style>
</head>
<body>
<header>
  <h1>みんなで推し活</h1>
</header>
<p class="lead" id="lead"></p>
<div id="grid"></div>
<div id="toast" role="status"></div>
<a id="back" href="./">時計に戻る</a>
<script src="cards.js?v=20261017133903"></script>
<script src="votes.js?v=20261017133903"></script>
<script>
  const grid = document.getElementById('grid'), lead = document.getElementById('lead'), toast = document.getElementById('toast');
  let toastTimer;
  const say = (t) => { toast.textContent = t; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 3500); };

  function render() {
    const entered = Votes.justEntered(), list = Votes.waiting();
    lead.innerHTML = list.length
      ? `いいね集めた子から時計にデビューできるよ〜。いま推し待ちは${list.length}人!推しをタップして応援してね${Votes.TEST_MODE ? '(テスト中: 何度でもOK)' : '(同じ子には1日1回までね)'}。<br>ランクインしたら、お礼メッセージつきで${Votes.ENTER_MS / 60000}分間、時計にドーンと登場するよ。`
      : `みんな上位に入っています。`;
    grid.innerHTML = '';
    if (!list.length && !entered.length) { grid.innerHTML = '<div class="empty">応援待ちの子はいません</div>'; return; }
    [...entered, ...list].forEach((c) => {
      const b = document.createElement('button');
      const isIn = entered.includes(c);
      b.className = 'tile' + (isIn ? ' in' : Votes.canVote(c.id) ? '' : ' done');
      b.type = 'button';
      b.innerHTML = `<img loading="lazy" decoding="async" alt="" src="${encodeURI(c.thumb || c.src)}"><span>${Votes.count(c.id)}</span>${isIn ? '<em>ランクイン!</em>' : ''}`;
      b.addEventListener('click', () => {
        const r = Votes.vote(c.id);
        if (!r.ok) return say('この子には今日はもういいね済みです');
        render();
      });
      grid.appendChild(b);
    });
  }
  render();
</script>
</body>
</html>
