<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI美女時計 ギャラリー</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300&text=AI%E7%BE%8E%E5%A5%B3%E6%99%82%E8%A8%88%E3%82%AE%E3%83%A3%E3%83%A9%E3%83%AA%E3%83%BC0123456789%E6%9E%9A&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e0c12; --fg: #f1eef3; --accent: #ff8fb8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 22px 24px 8px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; font-weight: 300; letter-spacing: .3em; }
  h1::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
               background: var(--accent); margin-right: .9em; vertical-align: .12em; box-shadow: 0 0 10px var(--accent); }
  header span { color: #f1eef380; font-size: 13px; letter-spacing: .08em; }
  header a { margin-left: auto; color: #f1eef3b0; font-size: 13px; text-decoration: none; letter-spacing: .08em; }
  header a:hover { color: #fff; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 14px 24px 40px; }
  #grid a { display: block; position: relative; border-radius: 10px; overflow: hidden; background: #1a1720;
            aspect-ratio: 3 / 4; }
  #grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease, opacity .3s; }
  #grid a:hover img { transform: scale(1.04); }
  #grid a::after { content: attr(data-n); position: absolute; left: 6px; bottom: 5px; font-size: 11px; color: #fffc;
                   text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity .2s; }
  #grid a:hover::after { opacity: 1; }
  @media (max-width: 520px) { #grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; padding: 10px 12px 30px; }
                              header { padding: 16px 14px 4px; } h1 { font-size: 17px; } }
</style>
</head>
<body>
<header>
  <h1>AI美女時計 ギャラリー</h1>
  <span id="count"></span>
  <a href="./">時計に戻る</a>
</header>
<div id="grid"></div>
<script src="cards.js"></script>
<script>
  // サムネイルは thumbs/NN.webp(縮小版)。押すとその画像で時計を開く
  const grid = document.getElementById('grid');
  CARDS.forEach((c, i) => {
    const a = document.createElement('a');
    a.href = `index.html?img=${i}`;
    a.dataset.n = i + 1;
    a.setAttribute('aria-label', `${i + 1}枚目を時計で開く`);
    const img = document.createElement('img');
    img.loading = 'lazy'; img.decoding = 'async';
    img.src = `thumbs/${String(i).padStart(2, '0')}.webp`;
    img.alt = '';
    a.appendChild(img);
    grid.appendChild(a);
  });
  document.getElementById('count').textContent = `${CARDS.length}枚`;
</script>
</body>
</html>
