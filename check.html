  const $ = (id) => document.getElementById(id);
  let i = 0, msgOn = true, rnd = true;   // メッセージはデフォルトで表示(ONの状態から始まる)
  try { msgOn = localStorage.getItem('check_msg2') !== '0'; } catch (e) {}
  try { rnd = localStorage.getItem('check_rnd') !== '0'; } catch (e) {}
  // ランダム表示は「シャッフルした袋」から1枚ずつ。全部出し切るまで同じ写真は出ない(出現頻度を均等に見る用)
  let bag = [], hist = [], hp = -1;
  const shuffle = (n) => { const a = [...Array(n).keys()]; for (let k = n - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
  function render(k) {
    i = ((k % ITEMS.length) + ITEMS.length) % ITEMS.length;
    const x = ITEMS[i];
    $('n').value = i + 1;
    $('msg').classList.toggle('on', msgOn);
    $('rnd').classList.toggle('on', rnd);
    $('rnd').textContent = rnd ? 'ランダム' : '順番';
    $('name').textContent = x.f + (x.msg ? '  「' + x.msg + '」' : '');
    if (x.i >= 0) {
      $('plain').style.display = 'none'; $('f').style.display = 'block';
      $('f').src = `index.html?img=${x.i}&t=12:34${msgOn ? '&msg=1' : ''}&_=${Date.now()}`;
    } else {
      $('f').style.display = 'none'; $('plain').style.display = 'flex'; $('pimg').src = x.src;
    }
    history.replaceState(null, '', `#${i + 1}`);
  }
  function go(dir) {
    if (!rnd) { render(i + dir); return; }
    if (dir < 0) { if (hp > 0) { hp--; render(hist[hp]); } return; }
    if (hp < hist.length - 1) { hp++; render(hist[hp]); return; }
    if (!bag.length) bag = shuffle(ITEMS.length).filter((k) => k !== i);
    hist.push(bag.pop()); hp = hist.length - 1; render(hist[hp]);
  }
  const show = (k) => { if (rnd) { hist = hist.slice(0, hp + 1); hist.push(((k % ITEMS.length) + ITEMS.length) % ITEMS.length); hp = hist.length - 1; } render(k); };
  $('total').textContent = ITEMS.length;
  $('prev').onclick = () => go(-1);
  $('next').onclick = () => go(1);
  $('n').onchange = () => show((+$('n').value || 1) - 1);
  $('msg').onclick = () => { msgOn = !msgOn; try { localStorage.setItem('check_msg2', msgOn ? '1' : '0'); } catch (e) {} render(i); };
  $('rnd').onclick = () => { rnd = !rnd; try { localStorage.setItem('check_rnd', rnd ? '1' : '0'); } catch (e) {} bag = []; hist = [i]; hp = 0; render(i); };
  const onKey = (e) => {
    if (e.target === $('n')) return false;
    if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'm' || e.key === 'M') $('msg').click();
    else return false;
    return true;
  };
  addEventListener('keydown', (e) => { onKey(e); });
  // 時計画面(iframe)にフォーカスがあると矢印キーを index.html 側が処理して画像だけ変わり、番号がずれる。
  // iframe 内のキーも親で処理し、時計画面側の切り替えは止める(iframe は読み込みごとに作り直されるので毎回付ける)
  $('f').addEventListener('load', () => {
    try { $('f').contentWindow.addEventListener('keydown', (e) => { if (onKey(e)) { e.stopImmediatePropagation(); e.preventDefault(); } }, true); } catch (err) {}
  });
  // 時計画面(iframe)が古い cards.js をキャッシュから読まないよう、先に最新を取り直してから最初の1枚を出す
  const init = () => { const st = parseInt(location.hash.slice(1)); const k = st ? st - 1 : (rnd ? Math.floor(Math.random() * ITEMS.length) : 0); hist = [k]; hp = 0; render(k); };
  fetch('cards.js', { cache: 'reload' }).catch(() => {}).then(init);
</script>
